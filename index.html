<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dune Timer</title>
<style>
  :root {
    --bg: #1a1410;
    --card-bg: #2a2118;
    --accent: #d99b4a;
    --accent-active: #e8542a;
    --text: #f0e6d8;
    --text-dim: #a89a86;
    --border: #4a3a28;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: radial-gradient(circle at top, #2a1f14, #14100c 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(0.5rem, 3vw, 2rem);
  }
  h1 {
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    font-size: clamp(1rem, 4vw, 1.6rem);
    margin: 0 0 clamp(0.5rem, 2vw, 1.5rem);
  }
  .players {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(0.4rem, 2vw, 1rem);
    width: 100%;
    max-width: 560px;
  }
  .player {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: clamp(0.5rem, 2.5vw, 1.25rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(0.25rem, 1.5vw, 0.75rem);
    transition: border-color 0.2s, box-shadow 0.2s;
    min-width: 0;
  }
  .player.running {
    border-color: var(--accent-active);
    box-shadow: 0 0 16px rgba(232, 84, 42, 0.35);
  }
  .avatar {
    width: clamp(48px, 16vw, 96px);
    height: clamp(48px, 16vw, 96px);
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--border);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .player.running .avatar {
    border-color: var(--accent-active);
    box-shadow: 0 0 12px rgba(232, 84, 42, 0.5);
  }
  .name-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: clamp(0.8rem, 3vw, 1.1rem);
    text-align: center;
    padding: 0.3rem 0.2rem;
    min-width: 0;
  }
  .name-input:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }
  .time {
    font-variant-numeric: tabular-nums;
    font-size: clamp(1.1rem, 5.5vw, 2.2rem);
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .toggle-btn {
    width: 100%;
    padding: clamp(0.4rem, 2vw, 0.7rem);
    font-size: clamp(0.75rem, 3vw, 1rem);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: var(--accent);
    color: #1a1410;
    transition: background 0.2s, transform 0.1s;
  }
  .toggle-btn:active {
    transform: scale(0.97);
  }
  .toggle-btn.running {
    background: var(--accent-active);
    color: #fff;
  }
  .stats {
    width: 100%;
    max-width: 560px;
    margin-top: clamp(0.5rem, 2.5vw, 1rem);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: clamp(0.6rem, 3vw, 1.25rem);
  }
  .stats-total {
    text-align: center;
    color: var(--text-dim);
    font-size: clamp(0.7rem, 2.5vw, 0.85rem);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .stats-total strong {
    color: var(--accent);
    font-size: clamp(1rem, 4vw, 1.4rem);
    font-variant-numeric: tabular-nums;
    display: block;
    letter-spacing: 0.03em;
    margin-top: 0.15rem;
  }
  .stat-chart {
    display: flex;
    flex-direction: column;
    gap: clamp(0.4rem, 2vw, 0.6rem);
    margin: clamp(0.6rem, 3vw, 0.9rem) 0;
  }
  .stat-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .stat-avatar {
    width: clamp(26px, 7vw, 36px);
    height: clamp(26px, 7vw, 36px);
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--border);
    flex-shrink: 0;
  }
  .stat-info {
    flex: 1;
    min-width: 0;
  }
  .stat-name-row {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    font-size: clamp(0.68rem, 2.6vw, 0.85rem);
    margin-bottom: 0.2rem;
  }
  .stat-name {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stat-pct {
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .stat-bar-track {
    background: rgba(255, 255, 255, 0.07);
    border-radius: 6px;
    height: 9px;
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-active));
    border-radius: 6px;
    transition: width 0.3s;
  }
  .stats-longest {
    text-align: center;
    font-size: clamp(0.68rem, 2.6vw, 0.85rem);
    color: var(--text-dim);
    border-top: 1px solid var(--border);
    padding-top: clamp(0.4rem, 2vw, 0.6rem);
  }
  .actions {
    display: flex;
    gap: 0.6rem;
    margin-top: clamp(0.75rem, 3vw, 1.5rem);
  }
  .reset-btn, .end-game-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: clamp(0.6rem, 2vw, 0.9rem) clamp(1.1rem, 5vw, 2rem);
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
  }
  .reset-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .end-game-btn {
    border-color: var(--accent-active);
    color: var(--accent-active);
    text-transform: uppercase;
    font-weight: 600;
  }
  .end-game-btn:hover {
    background: var(--accent-active);
    color: #fff;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 7, 5, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 10;
  }
  .modal-overlay[hidden] {
    display: none;
  }
  .modal {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: clamp(1rem, 4vw, 2rem);
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent-active);
    margin: 0 0 1rem;
    font-size: clamp(1.1rem, 5vw, 1.6rem);
  }
  .modal-actions {
    display: flex;
    gap: 0.6rem;
    margin-top: clamp(1rem, 4vw, 1.5rem);
  }
  .modal-actions button {
    flex: 1;
    padding: 0.75rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.85rem;
  }
  #modal-close {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  #modal-close:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  #modal-new-game {
    background: var(--accent);
    color: #1a1410;
  }
</style>
</head>
<body>

<h1>Dune Timer</h1>

<div class="players" id="players"></div>

<div class="stats" id="stats">
  <div class="stats-total">Total Game Time<strong id="total-time">00:00:00</strong></div>
  <div class="stat-chart" id="stat-chart"></div>
  <div class="stats-longest" id="stats-longest">Longest turn: —</div>
</div>

<div class="actions">
  <button class="end-game-btn" id="end-game">End Game</button>
  <button class="reset-btn" id="reset-all">Reset All</button>
</div>

<div class="modal-overlay" id="game-over-modal" hidden>
  <div class="modal">
    <h2>Game Over</h2>
    <div class="stats-total">Total Game Time<strong id="modal-total-time">00:00:00</strong></div>
    <div class="stat-chart" id="modal-stat-chart"></div>
    <div class="stats-longest" id="modal-stats-longest">Longest turn: —</div>
    <div class="modal-actions">
      <button id="modal-close">Close</button>
      <button id="modal-new-game">New Game</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'dune-timer-state';
  const NUM_PLAYERS = 4;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }

  const DEFAULT_NAMES = ['Tomasino', 'Kiki', 'Mikiska', 'Wojtaw'];
  const AVATARS = ['avatars/tomasino.jpg', 'avatars/kiki.jpg', 'avatars/mikiska.jpg', 'avatars/wojtaw.jpg'];

  function defaultState() {
    const players = [];
    for (let i = 0; i < NUM_PLAYERS; i++) {
      players.push({
        name: DEFAULT_NAMES[i],
        elapsedMs: 0,
        running: false,
        startedAt: null
      });
    }
    return { players, turns: [] };
  }

  let state = loadState() || defaultState();
  if (!state.players || state.players.length !== NUM_PLAYERS) {
    state = defaultState();
  }
  if (!Array.isArray(state.turns)) {
    state.turns = [];
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function formatTime(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    const pad = n => String(n).padStart(2, '0');
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }

  function currentElapsed(player) {
    if (player.running) {
      return player.elapsedMs + (Date.now() - player.startedAt);
    }
    return player.elapsedMs;
  }

  function computeLongestTurn() {
    let best = null;
    state.turns.forEach(t => {
      if (!best || t.durationMs > best.durationMs) best = t;
    });
    state.players.forEach(p => {
      if (p.running) {
        const durationMs = Date.now() - p.startedAt;
        if (!best || durationMs > best.durationMs) best = { name: p.name, durationMs };
      }
    });
    return best;
  }

  function buildStatRow(entry, pct) {
    const row = document.createElement('div');
    row.className = 'stat-row';

    const avatar = document.createElement('img');
    avatar.className = 'stat-avatar';
    avatar.src = AVATARS[entry.index];
    avatar.alt = entry.name;

    const info = document.createElement('div');
    info.className = 'stat-info';

    const nameRow = document.createElement('div');
    nameRow.className = 'stat-name-row';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'stat-name';
    nameSpan.textContent = entry.name;

    const pctSpan = document.createElement('span');
    pctSpan.className = 'stat-pct';
    pctSpan.textContent = pct + '% · ' + formatTime(entry.elapsed);

    nameRow.appendChild(nameSpan);
    nameRow.appendChild(pctSpan);

    const track = document.createElement('div');
    track.className = 'stat-bar-track';
    const fill = document.createElement('div');
    fill.className = 'stat-bar-fill';
    fill.style.width = pct + '%';
    track.appendChild(fill);

    info.appendChild(nameRow);
    info.appendChild(track);
    row.appendChild(avatar);
    row.appendChild(info);
    return row;
  }

  function renderStatsInto(chartEl, totalEl, longestEl) {
    const total = state.players.reduce((sum, p) => sum + currentElapsed(p), 0);
    const sorted = state.players
      .map((p, i) => ({ name: p.name, index: i, elapsed: currentElapsed(p) }))
      .sort((a, b) => b.elapsed - a.elapsed);

    totalEl.textContent = formatTime(total);

    chartEl.innerHTML = '';
    sorted.forEach(entry => {
      const pct = total > 0 ? Math.round((entry.elapsed / total) * 100) : 0;
      chartEl.appendChild(buildStatRow(entry, pct));
    });

    const longest = computeLongestTurn();
    longestEl.textContent = longest
      ? 'Longest turn: ' + formatTime(longest.durationMs) + ' — ' + longest.name
      : 'Longest turn: —';
  }

  const container = document.getElementById('players');
  const cards = [];

  state.players.forEach((player, index) => {
    const card = document.createElement('div');
    card.className = 'player';

    const avatar = document.createElement('img');
    avatar.className = 'avatar';
    avatar.src = AVATARS[index];
    avatar.alt = player.name;

    const nameInput = document.createElement('input');
    nameInput.className = 'name-input';
    nameInput.type = 'text';
    nameInput.value = player.name;
    nameInput.maxLength = 30;
    nameInput.addEventListener('input', () => {
      state.players[index].name = nameInput.value;
      avatar.alt = nameInput.value;
      saveState();
    });

    const timeEl = document.createElement('div');
    timeEl.className = 'time';
    timeEl.textContent = formatTime(currentElapsed(player));

    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'toggle-btn';
    toggleBtn.textContent = 'Start';
    toggleBtn.addEventListener('click', () => {
      const now = Date.now();
      const p = state.players[index];
      const wasRunning = p.running;
      state.players.forEach((other, otherIndex) => {
        if (other.running) {
          const durationMs = now - other.startedAt;
          other.elapsedMs += durationMs;
          other.running = false;
          other.startedAt = null;
          state.turns.push({ index: otherIndex, name: other.name, durationMs });
        }
      });
      if (!wasRunning) {
        p.running = true;
        p.startedAt = now;
      }
      saveState();
      render();
    });

    card.appendChild(avatar);
    card.appendChild(nameInput);
    card.appendChild(timeEl);
    card.appendChild(toggleBtn);
    container.appendChild(card);

    cards.push({ card, timeEl, toggleBtn, nameInput });
  });

  function render() {
    state.players.forEach((player, index) => {
      const { card, timeEl, toggleBtn, nameInput } = cards[index];
      timeEl.textContent = formatTime(currentElapsed(player));
      if (player.running) {
        card.classList.add('running');
        toggleBtn.classList.add('running');
        toggleBtn.textContent = 'Stop';
      } else {
        card.classList.remove('running');
        toggleBtn.classList.remove('running');
        toggleBtn.textContent = 'Start';
      }
      if (document.activeElement !== nameInput) {
        nameInput.value = player.name;
      }
    });
    renderStatsInto(
      document.getElementById('stat-chart'),
      document.getElementById('total-time'),
      document.getElementById('stats-longest')
    );
  }

  function resetGame() {
    state = defaultState();
    saveState();
    cards.forEach(({ nameInput }, index) => {
      nameInput.value = state.players[index].name;
    });
    render();
  }

  document.getElementById('reset-all').addEventListener('click', () => {
    if (!confirm('Reset all names and times?')) return;
    resetGame();
  });

  const gameOverModal = document.getElementById('game-over-modal');

  document.getElementById('end-game').addEventListener('click', () => {
    const now = Date.now();
    state.players.forEach((p, index) => {
      if (p.running) {
        const durationMs = now - p.startedAt;
        p.elapsedMs += durationMs;
        p.running = false;
        p.startedAt = null;
        state.turns.push({ index, name: p.name, durationMs });
      }
    });
    saveState();
    render();
    renderStatsInto(
      document.getElementById('modal-stat-chart'),
      document.getElementById('modal-total-time'),
      document.getElementById('modal-stats-longest')
    );
    gameOverModal.hidden = false;
  });

  document.getElementById('modal-close').addEventListener('click', () => {
    gameOverModal.hidden = true;
  });

  gameOverModal.addEventListener('click', (e) => {
    if (e.target === gameOverModal) gameOverModal.hidden = true;
  });

  document.getElementById('modal-new-game').addEventListener('click', () => {
    resetGame();
    gameOverModal.hidden = true;
  });

  render();
  setInterval(render, 1000);
</script>

</body>
</html>
